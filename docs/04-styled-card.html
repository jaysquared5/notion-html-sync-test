<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test Doc 4 — Styled Card</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0b0d10; color: #eee; padding: 24px; }
  .card {
    max-width: 420px;
    margin: 0 auto;
    padding: 24px;
    border-radius: 16px;
    background: linear-gradient(160deg, #1a1e2a, #10131c);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    border: 1px solid #2a2f3d;
  }
  .card h1 { font-size: 20px; margin: 0 0 8px; color: #ffb454; }
  .card p { font-size: 14px; line-height: 1.5; color: #aab; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; background: #ffb454; color: #1a1000; margin-top: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Test Document 4: Styled Card</h1>
  <p>This is the heaviest CSS case in the set — gradients, shadows, a dark palette, flex-free
  layout via plain block/margin centering. If Notion's sync strips or sandboxes &lt;style&gt;
  blocks, this is the one that will look wrong.</p>
  <span class="badge">DOC-4-STYLED-CARD</span>
</div>
</body>
</html>
